name: Publish crates
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop release execution ID
        type: string
        required: true
      beepboop_title:
        description: Release title
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
defaults: { run: { shell: bash } }
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  release:
    name: Validate release commit
    permissions: { contents: read, id-token: write }
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Require CI and publication to use the dispatched commit
        env:
          SOURCE_SHA: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
        run: test "$SOURCE_SHA" = "$GITHUB_SHA"
      - name: Require a commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Match the release version to every published crate
        uses: $/.github/actions/check-release
        with: { tag: "v${{ fromJSON(steps.beepboop.outputs.context).version }}" }
  checks: {
    name: Release checks,
    needs: release,
    uses: $/.github/workflows/ci.yml,
  }
  publish:
    name: Publish workspace to crates.io
    permissions: { contents: read, id-token: write }
    needs: [release, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Publish all crates in dependency order
        uses: kjanat/beepboop/actions/publish@v1
        with:
          credentials: '{"CARGO_REGISTRY_TOKEN":"crates-io"}'
      - uses: kjanat/beepboop/actions/token@v1
        id: token
        with:
          permission-contents: write
      - name: Tag the published version
        uses: kjanat/beepboop/actions/publish-refs@v1
        with: { token: "${{ steps.token.outputs.token }}" }
      - name: Publish the GitHub Release
        uses: kjanat/beepboop/actions/publish-release@v1
