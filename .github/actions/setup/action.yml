name: Set up the workspace
description: Install the workspace's Rust toolchain and configure its cache
inputs:
  workspace:
    description: Absolute path to the workspace directory
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # v0.28.0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with: { python-version-file: "${{ inputs.workspace }}/.python-version" }
    - id: version
      shell: bash
      env: { RUNNER_DIR: "${{ inputs.workspace }}" }
      run: run rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with: { workspaces: "${{ inputs.workspace }}" }
